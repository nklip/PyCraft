<!DOCTYPE html>
<html lang="en">

<head>
    <title>Chatbot</title>
    <link rel="icon" href="/chatbot/static/img/chat.png">

    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta content="utf-8" http-equiv="encoding" />

    <!-- Import materialize.css -->
    <link rel="stylesheet" type="text/css" href="/chatbot/static/vendor/materialize.min.css"/>

    <!-- Import CSS styles for components -->
    <link rel="stylesheet" type="text/css" href="/chatbot/static/css/buttons.css"/>
    <link rel="stylesheet" type="text/css" href="/chatbot/static/css/table.css"/>
    <link rel="stylesheet" type="text/css" href="/chatbot/static/css/style.css"/>
</head>

<body>
    <script>
        var userName = "inikki";
    </script>

    <script type="text/javascript" src="/chatbot/static/vendor/jquery.min.js"></script>
    <script type="text/javascript" src="/chatbot/static/vendor/jquery-ui.js"></script>
    <script type="text/javascript" src="/chatbot/static/vendor/materialize.min.js"></script>
    <script type="text/javascript" src="/chatbot/static/vendor/showdown.min.js"></script>

    <!--
      The socket is opened here, before the components load: chat.js assigns
      ws.onmessage at the top level, so ws has to be a real object by then.
      tojson quotes and escapes the values, which is what the old
      .replaceAll("&#34;", "") was working around.
    -->
    <script type="text/javascript">
        const WS_HOST = {{ ws_host | tojson }};
        const CLIENT_ID = {{ soeid | tojson }};

        let ws = new WebSocket(`${WS_HOST}/communicate?client_id=${CLIENT_ID}`);
        ws.onopen = () => console.log("Web socket connect established.");
        ws.onclose = () => console.log("Web socket connect closed.");
        ws.onerror = (event) => console.log("Web socket connection error.", event);
    </script>

    <!--
      Ordinary deferred script tags, in dependency order. defer runs them after
      the document is parsed, so handlers bound at top level (chat.js binds
      .userInput) find their elements. These were previously injected
      at runtime by a hand-rolled include(); browsers do not revalidate
      dynamically inserted scripts on a hard reload, so a stale component could
      survive a cache clear and break the page with no visible error.
    -->
    <script type="text/javascript" defer src="/chatbot/static/js/components/buttons.js"></script>
    <script type="text/javascript" defer src="/chatbot/static/js/components/chat.js"></script>
    <script type="text/javascript" defer src="/chatbot/static/js/components/table.js"></script>
    <script type="text/javascript" defer src="/chatbot/static/js/components/report-bug.js"></script>
    <script type="text/javascript" defer src="/chatbot/static/js/index.js"></script>

    <div class="container">
        <div class="widget">
            <div class="chatbox-header">
                <span class="chatbox-header-title">My Virtual Assistant</span>
                <div class="chatbox-controls">
                    <button class="reload-btn disabled" title="Reconnect" aria-label="Reconnect"><i></i></button>
                    <button class="minimize-btn" title="Minimize" aria-label="Minimize"><i></i></button>
                    <button class="expand-btn" title="Expand" aria-label="Expand"><i></i></button>
                    <button class="close-btn" title="Close" aria-label="Close"><i></i></button>
                </div>
            </div>
            <div class="chatbox-header-logo">
                <a href="#">
                    <img src="/chatbot/static/img/chatbot-logo.png" title="Kafka" alt="Kafka">
                </a>
                <span class="salutation" id="salutation"></span>
            </div>

            <!-- chatbot content goes here -->
            <div class="chats" id="chats">
                <div class="clearfix"></div>
            </div>

            <button class="scroll-to-top" id="scroll-to-top" title="Scroll to top" aria-label="Scroll to top">
                <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor"
                     stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M12 19V5M5 12l7-7 7 7"/>
                </svg>
            </button>

            <!-- keypad for users to enter messages -->
            <div class="core-chat-footer">
                <div class="footerContainer pos-relative">
                    <textarea class="chatInputBox userInput" id="userInput" rows="1"
                              placeholder="Type a message..." aria-label="Message"></textarea>
                    <div class="quick-links">
                        <a href="mailto:nikita.lipatov@gmail.com" class="quick-link" target="_blank"
                           title="Support" aria-label="Email support">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="2"/>
                                <path d="m3 7.5 9 6 9-6"/>
                            </svg>
                        </a>
                        <button type="button" class="quick-link report-bug-open"
                                title="Report a bug" aria-label="Report a bug">
                            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor"
                                 stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M9 5.5 7.5 3.5M15 5.5l1.5-2"/>
                                <rect x="7.5" y="7" width="9" height="12.5" rx="4.5"/>
                                <path d="M12 10.5v7M7.5 11H4M7.5 15H3.5M8 18.5 5.5 20M16.5 11H20M16.5 15H20.5M16 18.5l2.5 1.5"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <div class="chat-button">
            <div class="message">
                <span class="tooltiptext">My Virtual Assistant</span>
            </div>
        </div>
    </div>
    <!-- table.js -->
    <div class="popup" style="display: none;">
        <div class="close-btn" style="float: right">
            <span class="icon">&#10006</span>
        </div>
        <div id="tablePopupContainer"></div>
    </div>

</body>

</html>
