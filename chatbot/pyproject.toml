[project]
name = "chatbot"
version = "0.1.0"
description = "WebSocket chatbot UI built with FastAPI."
requires-python = ">=3.14"
dependencies = [
    # Anthropic's Python SDK, behind the claude mode. Optional at runtime in the
    # sense that matters: with no API key the mode says so and the rest works.
    "anthropic>=1.4.0",
    "fastapi>=0.141.1",
    # Backs starlette's Jinja2Templates
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.7",
    "uvicorn>=0.52.1",
    # uvicorn's WebSocket protocol implementation. The test client does not use
    # it, so tests pass without it while the real server rejects upgrades.
    "websockets>=17.0.1",
]

[dependency-groups]
test = [
    # Both httpx generations are load-bearing, and neither replaces the other.
    # starlette's TestClient imports httpx2 and only falls back to httpx with a
    # deprecation warning, while anthropic still builds its errors from httpx
    # objects, which the claude client tests construct by hand. httpx arrives
    # through anthropic anyway; the tests import it, so they declare it.
    "httpx>=0.28",
    "httpx2>=2.12",
    "pytest>=9.1",
    "pytest-cov>=6.0",
]
dev = [
    { include-group = "test" },
    "ruff>=0.9",
]

[tool.uv]
# Chatbot is a deployable application, not an installable distribution, so uv
# manages its dependencies without building the project itself.
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "RUF",  # ruff-specific rules
]
ignore = [
    # The formatter already enforces line length; what it leaves behind are
    # comments and URLs it cannot legally break.
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]
