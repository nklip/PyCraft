[project]
name = "lemon"
version = "0.1.0"
description = "Little Lemon restaurant backend built with Django and Django REST Framework."
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.1",
    "django-environ>=0.14.0",
    "djangorestframework>=3.18.1",
    "djoser>=2.3.4",
    "markdown>=3.11",
    "mysqlclient>=2.3.0",
]

[dependency-groups]
test = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-cov>=7.1.0",
]
dev = [
    { include-group = "test" },
    "django-debug-toolbar>=8.0.0",
    "ruff>=0.16.9",
]

[tool.uv]
# Lemon is a deployable application, not an installable distribution, so uv
# manages its dependencies without building the project itself.
package = false
# djoser caps social-auth-app-django below 6, and every 5.x release caps
# social-auth-core below 5.0.0, the first release to fix CVE-2026-57175 through
# CVE-2026-57179. Lemon mounts djoser's user and token URLs, not its social
# ones, so neither package is ever imported and lifting the cap changes no code
# lemon runs. Remove this once a djoser release allows 6.x:
# https://github.com/sunscrapers/djoser/issues/924
override-dependencies = ["social-auth-app-django>=6.0.1"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["src"]
# Django's own convention puts app tests in tests.py, which pytest would
# otherwise skip.
python_files = ["test_*.py", "tests.py"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/tests.py",
    "src/manage.py",
    "*/asgi.py",
    "*/wsgi.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "DJ",   # flake8-django
    "RUF",  # ruff-specific rules
]
ignore = [
    # The formatter already enforces line length; what it leaves behind are
    # comments and URLs it cannot legally break.
    "E501",
    # En dashes and typographic quotes in prose comments are intentional.
    "RUF003",
    # Django and DRF declare class-level lists (fields, permission_classes,
    # throttle_classes) by design.
    "RUF012",
]

[tool.ruff.lint.per-file-ignores]
# Settings modules layer overrides on top of a star import by design.
"src/config/settings/*.py" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["api", "config", "lemon"]
